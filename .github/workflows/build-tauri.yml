name: 'Build and Release Tauri App'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Para macOS .app / .dmg / .tar.gz
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # Para macOS Intel
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04' # Para Linux .deb / .AppImage
            args: ''
          - platform: 'windows-latest' # Para Windows .exe / .msi
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Create mock frontendDist
        shell: bash
        run: |
          mkdir -p out
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=http://localhost:3000"></head><body><h2>Inicie o servidor Next.js localmente na porta 3000</h2></body></html>' > out/index.html

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
        with:
          tagName: MetaBuilderPRO-v__VERSION__
          releaseName: 'MetaBuilder PRO v__VERSION__'
          releaseBody: 'Nova versão do MetaBuilder PRO disponível!'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
