name: 'Build and Release Tauri App'

on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: 'Build for Windows'
        type: boolean
        default: true
      build_macos:
        description: 'Build for macOS'
        type: boolean
        default: true
      build_linux:
        description: 'Build for Linux'
        type: boolean
        default: true
      release_notes:
        description: 'Release notes / changelog'
        type: string
        default: 'Nova versão do MetaBuilder PRO disponível!'
      generate_release_notes:
        description: 'Auto-generate release notes from commits'
        type: boolean
        default: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          echo '{"include":[' > matrix.json
          
          if [ "${{ github.event.inputs.build_macos }}" == "true" ]; then
            echo '{"platform":"macos-latest","args":"--target aarch64-apple-darwin --bundles app,dmg,updater","pkg_target":"node18-macos-arm64","tauri_triple":"aarch64-apple-darwin","os":"macos"},' >> matrix.json
            echo '{"platform":"macos-latest","args":"--target x86_64-apple-darwin --bundles app,dmg,updater","pkg_target":"node18-macos-x64","tauri_triple":"x86_64-apple-darwin","os":"macos"},' >> matrix.json
          fi
          
          if [ "${{ github.event.inputs.build_linux }}" == "true" ]; then
            echo '{"platform":"ubuntu-22.04","args":"--bundles deb,updater","pkg_target":"node18-linux-x64","tauri_triple":"x86_64-unknown-linux-gnu","os":"linux"},' >> matrix.json
          fi
          
          if [ "${{ github.event.inputs.build_windows }}" == "true" ]; then
            echo '{"platform":"windows-latest","args":"--bundles msi,updater","pkg_target":"node18-win-x64","tauri_triple":"x86_64-pc-windows-msvc","os":"windows"},' >> matrix.json
          fi
          
          # Remove trailing comma
          sed -i '$ s/,$//' matrix.json
          echo ']}' >> matrix.json
          
          # Output to GitHub Actions
          MATRIX_JSON=$(cat matrix.json | tr -d '\n')
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

  build-tauri:
    needs: setup
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Create mock frontendDist
        shell: bash
        run: |
          mkdir -p out
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=http://localhost:3000"></head><body><h2>Inicie o servidor Next.js localmente na porta 3000</h2></body></html>' > out/index.html

      - name: Build CLI Sidecar
        shell: bash
        run: |
          cd cli
          npm install
          npx pkg . --targets ${{ matrix.pkg_target }} --out-path dist
          mkdir -p ../src-tauri/bin
          # O pkg gera o arquivo com o nome 'cli' (Linux/macOS) ou 'cli.exe' (Windows).
          # Vamos mover para a pasta src-tauri/bin com o nome correto esperado pelo Tauri.
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            mv dist/cli.exe ../src-tauri/bin/cli-${{ matrix.tauri_triple }}.exe
          else
            mv dist/cli ../src-tauri/bin/cli-${{ matrix.tauri_triple }}
          fi

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGN_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGN_PASSWORD: ${{ secrets.TAURI_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'MetaBuilder PRO v__VERSION__'
          releaseBody: ${{ github.event.inputs.release_notes }}
          generateReleaseNotes: ${{ github.event.inputs.generate_release_notes == 'true' }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Generate latest.json if missing
        if: matrix.os == 'windows'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ steps.tauri.outputs.appVersion }}
        run: |
          echo "[INFO] Checking for updater JSON in artifacts..."
          ARTIFACT_PATHS='${{ steps.tauri.outputs.artifactPaths }}'
          echo "[INFO] Artifacts: $ARTIFACT_PATHS"
          
          # Check if a .json file exists in artifacts
          HAS_JSON=$(echo "$ARTIFACT_PATHS" | python3 -c "import sys,json; paths=json.load(sys.stdin); print(any(p.endswith('.json') for p in paths))" 2>/dev/null || echo "False")
          
          if [ "$HAS_JSON" != "True" ]; then
            echo "[INFO] No updater JSON found - generating manually with tauri signer..."
            # Find the MSI file
            MSI_PATH=$(find src-tauri/target -name '*.msi' | head -1)
            if [ -z "$MSI_PATH" ]; then
              echo "[ERROR] No MSI file found!"
              exit 1
            fi
            echo "[INFO] Found MSI: $MSI_PATH"
            
            # Sign the MSI using tauri signer
            npx tauri signer sign -k "$TAURI_SIGNING_PRIVATE_KEY" "$MSI_PATH"
            SIG_FILE="${MSI_PATH}.sig"
            SIG_CONTENT=$(cat "$SIG_FILE")
            
            # Get file size
            FILE_SIZE=$(stat -c%s "$MSI_PATH" 2>/dev/null || stat -f%z "$MSI_PATH")
            
            # Build public download URL (will be rewritten to Supabase by upload-release.js)
            GITHUB_REPO="$GITHUB_REPOSITORY"
            DOWNLOAD_URL="https://github.com/$GITHUB_REPO/releases/download/v${VERSION}/$(basename $MSI_PATH)"
            
            # Generate latest.json
            cat > src-tauri/target/latest.json <<EOF
          {
            "version": "$VERSION",
            "notes": "${{ github.event.inputs.release_notes }}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "$SIG_CONTENT",
                "url": "$DOWNLOAD_URL"
              }
            }
          }
          EOF
            echo "[INFO] Generated latest.json at src-tauri/target/latest.json"
          else
            echo "[INFO] Updater JSON already present in artifacts, skipping manual generation."
          fi

      - name: Upload Releases to Supabase
        run: |
          npm install ws
          node scripts/upload-release.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
          VERSION: ${{ steps.tauri.outputs.appVersion }}
