name: 'Build and Release Tauri App'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            pkg_target: 'node18-macos-arm64'
            tauri_triple: 'aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            pkg_target: 'node18-macos-x64'
            tauri_triple: 'x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
            pkg_target: 'node18-linux-x64'
            tauri_triple: 'x86_64-unknown-linux-gnu'
          - platform: 'windows-latest'
            args: ''
            pkg_target: 'node18-win-x64'
            tauri_triple: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Create mock frontendDist
        shell: bash
        run: |
          mkdir -p out
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=http://localhost:3000"></head><body><h2>Inicie o servidor Next.js localmente na porta 3000</h2></body></html>' > out/index.html

      - name: Build CLI Sidecar
        shell: bash
        run: |
          cd cli
          npm install
          npx pkg . --targets ${{ matrix.pkg_target }} --out-path dist
          mkdir -p ../src-tauri/bin
          # O pkg gera o arquivo com o nome 'cli' (Linux/macOS) ou 'cli.exe' (Windows).
          # Vamos mover para a pasta src-tauri/bin com o nome correto esperado pelo Tauri.
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            mv dist/cli.exe ../src-tauri/bin/cli-${{ matrix.tauri_triple }}.exe
          else
            mv dist/cli ../src-tauri/bin/cli-${{ matrix.tauri_triple }}
          fi

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
        with:
          tagName: MetaBuilderPRO-v__VERSION__
          releaseName: 'MetaBuilder PRO v__VERSION__'
          releaseBody: 'Nova versão do MetaBuilder PRO disponível!'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Upload Releases to Supabase
        run: node scripts/upload-release.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
          VERSION: ${{ steps.tauri.outputs.appVersion }}
