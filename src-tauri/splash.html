<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MetaBuilder PRO</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: transparent !important;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-user-select: none; user-select: none;
    }

    .wrapper {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      padding: 12px;
    }

    .card {
      width: 100%; height: 100%;
      background: linear-gradient(135deg, #111118 0%, #0f0f1a 60%, #0d0d16 100%);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      box-shadow: 0 0 60px rgba(0,0,0,0.7), 0 0 100px rgba(79,70,229,0.08);
      display: flex; flex-direction: column;
      align-items: center; justify-content: space-between;
      padding: 40px 48px 36px;
      position: relative; overflow: hidden;
      opacity: 0;
      animation: fadeIn 0.35s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* Glow blobs */
    .blob-top {
      position: absolute; top: -30%; left: -20%;
      width: 70%; height: 70%;
      background: radial-gradient(circle, rgba(99,102,241,0.18) 0%, transparent 70%);
      pointer-events: none;
    }
    .blob-bottom {
      position: absolute; bottom: -30%; right: -20%;
      width: 70%; height: 70%;
      background: radial-gradient(circle, rgba(168,85,247,0.18) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Content */
    .content {
      display: flex; flex-direction: column; align-items: center;
      gap: 16px; z-index: 1; flex: 1; justify-content: center;
    }

    .logo-box {
      width: 80px; height: 80px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
    }

    .logo-box svg {
      width: 48px; height: 48px;
    }

    h1 {
      font-size: 32px; font-weight: 900;
      color: #fff; letter-spacing: -0.5px; line-height: 1;
    }

    h1 span { color: #818cf8; }

    .subtitle {
      font-size: 11px; font-weight: 600;
      color: rgba(165,180,252,0.5);
      letter-spacing: 0.18em; text-transform: uppercase;
      margin-top: -8px;
    }

    /* Footer */
    .footer { width: 100%; z-index: 1; }

    .status-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px;
    }

    .status-left {
      display: flex; align-items: center; gap: 8px;
    }

    .spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(165,180,252,0.3);
      border-top-color: #818cf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status-text {
      font-size: 12px; font-weight: 500;
      color: rgba(163,163,163,0.8);
    }

    .pct {
      font-size: 12px; font-weight: 700;
      color: #818cf8;
    }

    .track {
      width: 100%; height: 4px;
      background: rgba(255,255,255,0.05);
      border-radius: 99px; overflow: hidden;
    }

    .bar {
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #a855f7);
      border-radius: 99px;
      width: 0%;
      transition: width 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body>
  <div class="wrapper" data-tauri-drag-region>
    <div class="card" data-tauri-drag-region>
      <div class="blob-top"></div>
      <div class="blob-bottom"></div>

      <div class="content" data-tauri-drag-region>
        <div class="logo-box">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
            <defs>
              <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#9333ea" />
                <stop offset="50%" stop-color="#4f46e5" />
                <stop offset="100%" stop-color="#2563eb" />
              </linearGradient>
            </defs>
            <rect width="512" height="512" fill="transparent"/>
            <g transform="translate(256, 256) scale(1.1) translate(-256, -256)">
              <path d="M 256 160 A 96 96 0 1 0 160 256 A 96 96 0 0 0 256 160 Z" fill="none" stroke="url(#neonGradient)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M 256 352 A 96 96 0 1 0 352 256 A 96 96 0 0 0 256 352 Z" fill="none" stroke="url(#neonGradient)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />
              <circle cx="160" cy="160" r="24" fill="url(#neonGradient)" />
              <circle cx="352" cy="352" r="24" fill="url(#neonGradient)" />
            </g>
          </svg>
        </div>
        <h1>MetaBuilder<span>PRO</span></h1>
        <p class="subtitle">IDE Engine <span id="version">v1.0</span></p>
      </div>

      <div class="footer">
        <div class="status-row">
          <div class="status-left">
            <div class="spinner"></div>
            <span class="status-text" id="status">Iniciando módulos core...</span>
          </div>
          <span class="pct" id="pct">0%</span>
        </div>
        <div class="track">
          <div class="bar" id="bar"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const steps = [
      { p: 12, msg: 'Iniciando módulos core...' },
      { p: 30, msg: 'Carregando ambiente de execução...' },
      { p: 52, msg: 'Verificando atualizações...' },
      { p: 74, msg: 'Iniciando MetaBuilder Engine...' },
      { p: 90, msg: 'Carregando interface...' },
      { p: 100, msg: 'Pronto!' }
    ]

    const bar    = document.getElementById('bar')
    const pct    = document.getElementById('pct')
    const status = document.getElementById('status')
    const verEl  = document.getElementById('version')



    // Progresso sincronizado: começa imediatamente quando a página carrega
    let step = 0
    function tick() {
      if (step >= steps.length) return
      const s = steps[step++]
      bar.style.width = s.p + '%'
      pct.textContent = s.p + '%'
      status.textContent = s.msg
      if (step < steps.length) {
        // Intervalo maior para o user ver cada etapa
        setTimeout(tick, step === steps.length - 1 ? 600 : 450)
      }
    }

    // Inicia o progresso assim que a página renderiza, sem delay artificial
    requestAnimationFrame(() => setTimeout(tick, 100))

    // Escuta evento do Rust para acelerar/forçar o fechamento
    if (window.__TAURI_INTERNALS__) {
      import('https://unpkg.com/@tauri-apps/api@2/event').then(({ listen }) => {
        listen('splash-close', () => {
          bar.style.width = '100%'
          pct.textContent = '100%'
          status.textContent = 'Pronto!'
        })
      }).catch(() => {})
    }
  </script>
</body>
</html>
